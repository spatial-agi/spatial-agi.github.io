<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" fill="none">
  <defs>
    <linearGradient id="coverGrad" x1="0" y1="0" x2="1" y2="0.15">
      <stop offset="0" stop-color="#C97A38"/>
      <stop offset="0.45" stop-color="#B96420"/>
      <stop offset="1" stop-color="#8F4C16"/>
    </linearGradient>
    <linearGradient id="coverOpenGrad" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#D08443"/>
      <stop offset="0.6" stop-color="#BA6624"/>
      <stop offset="1" stop-color="#9A5419"/>
    </linearGradient>
    <linearGradient id="pagesGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4EEE2"/>
      <stop offset="0.85" stop-color="#FBF8F1"/>
      <stop offset="1" stop-color="#E9E1D2"/>
    </linearGradient>
    <linearGradient id="pagesEdgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F1EADA"/>
      <stop offset="1" stop-color="#D9CFBC"/>
    </linearGradient>
    <radialGradient id="shadowGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2B1D14" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#2B1D14" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2B1D14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="backCoverGrad" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#A85A1D"/>
      <stop offset="1" stop-color="#7C4112"/>
    </linearGradient>
  </defs>

  <g transform="rotate(-2 310 260)">
    <!-- Ground shadow -->
    <ellipse cx="330" cy="432" rx="262" ry="24" fill="url(#shadowGrad)"/>

    <!-- Back cover (slightly larger, behind pages) -->
    <polygon points="172,130 346,102 346,354 172,382" fill="url(#backCoverGrad)"/>

    <!-- Page block -->
    <polygon points="188,145 336,118 336,344 188,368" fill="url(#pagesGrad)"/>

    <!-- Fore-edge thickness strip -->
    <polygon points="336,118 352,124 352,352 336,344" fill="url(#pagesEdgeGrad)"/>
    <line x1="338" y1="128" x2="350" y2="133" stroke="#C9BDA6" stroke-width="0.8"/>
    <line x1="338" y1="148" x2="350" y2="153" stroke="#C9BDA6" stroke-width="0.8"/>
    <line x1="338" y1="168" x2="350" y2="173" stroke="#C9BDA6" stroke-width="0.8"/>
    <line x1="338" y1="188" x2="350" y2="193" stroke="#C9BDA6" stroke-width="0.8"/>
    <line x1="338" y1="208" x2="350" y2="213" stroke="#C9BDA6" stroke-width="0.8"/>
    <line x1="338" y1="228" x2="350" y2="233" stroke="#C9BDA6" stroke-width="0.8"/>
    <line x1="338" y1="248" x2="350" y2="253" stroke="#C9BDA6" stroke-width="0.8"/>
    <line x1="338" y1="268" x2="350" y2="273" stroke="#C9BDA6" stroke-width="0.8"/>
    <line x1="338" y1="288" x2="350" y2="293" stroke="#C9BDA6" stroke-width="0.8"/>
    <line x1="338" y1="308" x2="350" y2="313" stroke="#C9BDA6" stroke-width="0.8"/>
    <line x1="338" y1="328" x2="350" y2="333" stroke="#C9BDA6" stroke-width="0.8"/>

    <!-- Fanned page lines at right of block (very subtle print lines) -->
    <path d="M 316,127 L 333,121" stroke="#DED5C3" stroke-width="0.8"/>
    <path d="M 314,140 L 334,134" stroke="#DED5C3" stroke-width="0.8"/>
    <path d="M 312,153 L 335,147" stroke="#DED5C3" stroke-width="0.8"/>

    <!-- Ribbon bookmark -->
    <path d="M 296,148 L 312,145 L 310,210 L 300,196 L 292,208 Z" fill="#8F2D1D" opacity="0.9"/>
    <path d="M 296,148 L 312,145 L 310,210 L 300,196 L 292,208 Z" fill="#000000" opacity="0.08"/>

    <!-- Spine -->
    <polygon points="172,130 188,136 188,374 172,382" fill="#7C4112"/>
    <polygon points="172,130 188,136 188,374 172,382" fill="#FFFFFF" opacity="0.05"/>

    <!-- Open front cover, swinging toward viewer (left) -->
    <path d="M 188,136
             C 150,168 112,206 74,250
             L 60,262
             C 58,330 58,372 60,408
             C 104,378 150,346 188,322
             Z"
          fill="url(#coverOpenGrad)"/>

    <!-- Curvature highlight on open cover -->
    <path d="M 188,142
             C 152,174 116,210 80,252
             L 66,264
             C 65,320 65,356 66,388
             C 106,360 148,330 188,306
             Z"
          fill="url(#sheen)" opacity="0.6"/>

    <!-- Cover edge line -->
    <path d="M 188,136 C 150,168 112,206 74,250 L 60,262" stroke="#6E3A0E" stroke-width="1.5" opacity="0.5"/>

    <!-- Printed design on the open cover (perspective-skewed) -->
    <g transform="translate(188,136) skewY(-30.5) translate(-188,-136)">
      <!-- inner frame -->
      <rect x="86" y="236" width="82" height="108" fill="none" stroke="#F4E3CC" stroke-width="1.4" opacity="0.85" rx="2"/>
      <text x="127" y="272" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" fill="#FBF3E6" text-anchor="middle">Spatial</text>
      <text x="127" y="291" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" fill="#FBF3E6" text-anchor="middle">Intelligence</text>
      <line x1="100" y1="301" x2="154" y2="301" stroke="#F4E3CC" stroke-width="1" opacity="0.8"/>
      <text x="127" y="316" font-family="-apple-system, system-ui, sans-serif" font-size="6.5" letter-spacing="0.6" fill="#F4E3CC" text-anchor="middle">PERCEPTION · REASONING · GENERATION</text>
      <text x="127" y="332" font-family="-apple-system, system-ui, sans-serif" font-size="7" font-weight="600" letter-spacing="1" fill="#FBF3E6" text-anchor="middle">2026</text>
    </g>

    <!-- Soft top light sweep across page block -->
    <path d="M 188,145 L 336,118 L 336,200 L 188,230 Z" fill="#FFFFFF" opacity="0.18"/>
  </g>
</svg>
