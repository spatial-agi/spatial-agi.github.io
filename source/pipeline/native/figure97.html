 and braking commands are applied to the physical vehicle."}, "panel-10": {"t": "Evaluation", "b": "Execution logs support score and collision evaluation; the plots are schematic."}, "panel-11": {"t": "Vehicle feedback", "b": "The vehicle changes the environment and receives fresh observations, closing the sensing and control loop."}}</script></div>
