aints."}, "optimization": {"t": "Noise optimization", "b": "DNO optimizes the initial latent noise through a fixed diffusion decoder. An edit loss measures the target and source motion, and gradients update the noise."}, "instruction": {"t": "Text-instruction editing", "b": "A natural-language instruction edits a source motion while preserving gait and untargeted joints. MotionFix learns a text editor; language-model methods compose primitive edits."}} </script></div>
