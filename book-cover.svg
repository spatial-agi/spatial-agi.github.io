<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" fill="none">
  <!-- Background -->
  <rect width="400" height="560" fill="#F5EFE6"/>

  <!-- Border -->
  <rect x="20" y="20" width="360" height="520" fill="none" stroke="#B96420" stroke-width="2"/>

  <!-- Title Section -->
  <text x="200" y="80" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="600" fill="#5C3D2E" text-anchor="middle">
    COMPREHENSIVE SURVEY
  </text>

  <text x="200" y="140" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#2B1D14" text-anchor="middle">
    Spatial
  </text>
  <text x="200" y="185" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#2B1D14" text-anchor="middle">
    Intelligence
  </text>

  <!-- 3D Coordinate System Visual -->
  <g transform="translate(200, 320)">
    <!-- Grid lines -->
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#E5DED3" stroke-width="1"/>
    <line x1="-60" y1="-20" x2="60" y2="20" stroke="#E5DED3" stroke-width="1"/>
    <line x1="-60" y1="20" x2="60" y2="-20" stroke="#E5DED3" stroke-width="1"/>

    <!-- Axis lines -->
    <line x1="-100" y1="0" x2="100" y2="0" stroke="#B96420" stroke-width="3" opacity="0.7"/>
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#B96420" stroke-width="3" opacity="0.7"/>
    <line x1="-60" y1="-60" x2="60" y2="60" stroke="#B96420" stroke-width="3" opacity="0.7"/>

    <!-- 3D Cube -->
    <path d="M -30,-40 L 30,-40 L 30,20 L -30,20 Z" fill="none" stroke="#5C3D2E" stroke-width="2"/>
    <path d="M -30,-40 L -10,-55 L 50,-55 L 30,-40 Z" fill="#B96420" fill-opacity="0.3" stroke="#5C3D2E" stroke-width="2"/>
    <path d="M 30,-40 L 50,-55 L 50,5 L 30,20 Z" fill="#B96420" fill-opacity="0.5" stroke="#5C3D2E" stroke-width="2"/>

    <!-- Sphere -->
    <circle cx="-50" cy="40" r="20" fill="none" stroke="#B96420" stroke-width="2"/>
    <ellipse cx="-50" cy="40" rx="20" ry="6" fill="none" stroke="#B96420" stroke-width="1.5"/>
    <ellipse cx="-50" cy="40" rx="6" ry="20" fill="none" stroke="#B96420" stroke-width="1.5"/>

    <!-- Point cloud representation -->
    <circle cx="60" cy="-30" r="2.5" fill="#5C3D2E"/>
    <circle cx="70" cy="-25" r="2.5" fill="#5C3D2E"/>
    <circle cx="65" cy="-35" r="2.5" fill="#5C3D2E"/>
    <circle cx="75" cy="-32" r="2.5" fill="#5C3D2E"/>
    <circle cx="68" cy="-22" r="2.5" fill="#5C3D2E"/>
    <circle cx="72" cy="-28" r="2.5" fill="#5C3D2E"/>

    <!-- Arrow heads -->
    <polygon points="100,0 95,-3 95,3" fill="#B96420"/>
    <polygon points="0,-80 -3,-75 3,-75" fill="#B96420"/>
    <polygon points="60,60 57,55 63,57" fill="#B96420"/>
  </g>

  <!-- Subtitle -->
  <text x="200" y="450" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#5C3D2E" text-anchor="middle">
    Perception • Reasoning • Generation
  </text>

  <!-- Bottom -->
  <text x="200" y="500" font-family="-apple-system, system-ui, sans-serif" font-size="18" font-weight="600" fill="#2B1D14" text-anchor="middle">
    2026 Edition
  </text>

  <!-- Decorative elements -->
  <circle cx="60" cy="60" r="4" fill="#B96420" opacity="0.3"/>
  <circle cx="340" cy="60" r="4" fill="#B96420" opacity="0.3"/>
  <circle cx="60" cy="500" r="4" fill="#B96420" opacity="0.3"/>
  <circle cx="340" cy="500" r="4" fill="#B96420" opacity="0.3"/>
</svg>
