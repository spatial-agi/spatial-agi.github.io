    <text x="280" y="128" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#5C3D2E" text-anchor="middle">Driving</text>
  </g>
  <g>
    <circle cx="442" cy="112" r="30" fill="#FFFFFF" stroke="#E5DED3" stroke-width="1.5"/>
    <text x="442" y="119" font-size="22" text-anchor="middle">🥽</text>
    <text x="442" y="162" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#5C3D2E" text-anchor="middle">XR</text>
