<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" fill="none">
  <rect width="560" height="360" fill="#F7FBFD"/>

  <text x="280" y="44" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0B2340" text-anchor="middle">A bibliography you can trust</text>

  <!-- Stacked papers -->
  <g transform="translate(210,190)">
    <rect x="-96" y="-92" width="150" height="190" rx="6" fill="#FFFFFF" stroke="#D4E1EB" stroke-width="1.5" transform="rotate(-9)"/>
    <rect x="-84" y="-88" width="150" height="190" rx="6" fill="#FFFFFF" stroke="#D4E1EB" stroke-width="1.5" transform="rotate(-4)"/>
    <rect x="-70" y="-84" width="150" height="190" rx="6" fill="#FFFFFF" stroke="#D4E1EB" stroke-width="1.5"/>

    <!-- Citation lines -->
    <g stroke="#AFC5D6" stroke-width="3" stroke-linecap="round">
      <line x1="-54" y1="-58" x2="62" y2="-58"/>
      <line x1="-54" y1="-42" x2="40" y2="-42"/>
      <line x1="-54" y1="-14" x2="62" y2="-14"/>
      <line x1="-54" y1="2" x2="26" y2="2"/>
      <line x1="-54" y1="30" x2="62" y2="30"/>
      <line x1="-54" y1="46" x2="36" y2="46"/>
      <line x1="-54" y1="74" x2="62" y2="74"/>
      <line x1="-54" y1="90" x2="48" y2="90"/>
    </g>
    <!-- Highlights -->
    <rect x="-58" y="-70" width="34" height="8" rx="4" fill="#5BA4D0" opacity="0.5"/>
    <rect x="-58" y="-20" width="52" height="8" rx="4" fill="#5BA4D0" opacity="0.35"/>
    <rect x="-58" y="22" width="40" height="8" rx="4" fill="#5BA4D0" opacity="0.35"/>
  </g>

  <!-- Quote mark -->
  <text x="352" y="128" font-family="Georgia, serif" font-size="110" fill="#1F6FAE" opacity="0.25" text-anchor="middle">"</text>

  <!-- Badge -->
  <g transform="translate(388,236)">
    <circle cx="0" cy="0" r="56" fill="#1F6FAE"/>
    <text x="0" y="-6" font-family="-apple-system, system-ui, sans-serif" font-size="24" font-weight="700" fill="#F4FAFD" text-anchor="middle">2,500+</text>
    <text x="0" y="16" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#DCECF7" text-anchor="middle">CURATED</text>
    <text x="0" y="31" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#DCECF7" text-anchor="middle">REFERENCES</text>
  </g>

  <!-- Check marks -->
  <g stroke="#1F6FAE" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M 128,96 L 138,106 L 156,86"/>
    <path d="M 118,320 L 128,330 L 146,310"/>
  </g>
</svg>
