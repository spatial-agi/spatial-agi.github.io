<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" fill="none">
  <defs>
    <linearGradient id="f1a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5BA4D0"/>
      <stop offset="1" stop-color="#165684"/>
    </linearGradient>
  </defs>
  <rect width="560" height="360" fill="#F7FBFD"/>

  <!-- 2D panel -->
  <g transform="translate(48,88)">
    <rect x="0" y="0" width="140" height="140" rx="10" fill="#FFFFFF" stroke="#D4E1EB" stroke-width="2"/>
    <g stroke="#AFC5D6" stroke-width="1">
      <line x1="28" y1="10" x2="28" y2="130"/><line x1="56" y1="10" x2="56" y2="130"/>
      <line x1="84" y1="10" x2="84" y2="130"/><line x1="112" y1="10" x2="112" y2="130"/>
      <line x1="10" y1="28" x2="130" y2="28"/><line x1="10" y1="56" x2="130" y2="56"/>
      <line x1="10" y1="84" x2="130" y2="84"/><line x1="10" y1="112" x2="130" y2="112"/>
    </g>
    <rect x="38" y="38" width="28" height="28" fill="#1F6FAE" opacity="0.85" rx="4"/>
    <rect x="84" y="84" width="28" height="28" fill="#1F6FAE" opacity="0.5" rx="4"/>
    <text x="70" y="160" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600" fill="#6F879D" text-anchor="middle">2D · PIXELS</text>
  </g>

  <!-- 3D panel -->
  <g transform="translate(210,88)">
    <rect x="0" y="0" width="140" height="140" rx="10" fill="#FFFFFF" stroke="#D4E1EB" stroke-width="2"/>
    <g transform="translate(70,72)">
      <path d="M -34,-26 L 20,-26 L 20,26 L -34,26 Z" fill="none" stroke="#1F6FAE" stroke-width="2"/>
      <path d="M -34,-26 L -14,-40 L 40,-40 L 20,-26 Z" fill="#5BA4D0" opacity="0.35" stroke="#1F6FAE" stroke-width="2"/>
      <path d="M 20,-26 L 40,-40 L 40,12 L 20,26 Z" fill="#5BA4D0" opacity="0.55" stroke="#1F6FAE" stroke-width="2"/>
      <circle cx="-7" cy="0" r="3" fill="#1F6FAE"/><circle cx="7" cy="8" r="3" fill="#1F6FAE"/>
      <circle cx="22" cy="-6" r="3" fill="#1F6FAE"/><circle cx="30" cy="0" r="3" fill="#1F6FAE"/>
    </g>
    <text x="70" y="160" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600" fill="#6F879D" text-anchor="middle">3D · VOLUMES</text>
  </g>

  <!-- 4D panel -->
  <g transform="translate(372,88)">
    <rect x="0" y="0" width="140" height="140" rx="10" fill="#FFFFFF" stroke="#D4E1EB" stroke-width="2"/>
    <g transform="translate(70,66)">
      <rect x="-46" y="-24" width="54" height="44" rx="6" fill="none" stroke="#AFC5D6" stroke-width="2"/>
      <rect x="-36" y="-16" width="54" height="44" rx="6" fill="none" stroke="#5BA4D0" stroke-width="2"/>
      <rect x="-26" y="-8" width="54" height="44" rx="6" fill="#5BA4D0" opacity="0.25" stroke="#1F6FAE" stroke-width="2"/>
      <path d="M 34,20 L 44,14 L 44,26 Z" fill="#1F6FAE"/>
    </g>
    <text x="70" y="160" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="600" fill="#6F879D" text-anchor="middle">4D · MOTION</text>
  </g>

  <!-- Title line -->
  <text x="280" y="46" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#0B2340" text-anchor="middle">One vocabulary, every dimension</text>
  <path d="M 120,66 L 440,66" stroke="#D4E1EB" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- connecting arrows -->
  <path d="M 196,158 L 204,158" stroke="#1F6FAE" stroke-width="2"/>
  <path d="M 200,154 L 206,158 L 200,162 Z" fill="#1F6FAE"/>
  <path d="M 358,158 L 366,158" stroke="#1F6FAE" stroke-width="2"/>
  <path d="M 362,154 L 368,158 L 362,162 Z" fill="#1F6FAE"/>

  <text x="280" y="300" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#6F879D" text-anchor="middle">From classical geometry to modern foundation models</text>
</svg>
